name: Verify official-TP-aligned suite

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Run one-command bootstrap on Linux
        if: runner.os != 'Windows'
        shell: bash
        run: ./bootstrap.sh

      - name: Run one-command bootstrap on Windows
        if: runner.os == 'Windows'
        shell: cmd
        run: bootstrap.cmd

      - name: Ensure generated artifacts are reproducible
        run: git diff --exit-code
